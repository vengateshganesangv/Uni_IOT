# TEST-ONLY Mosquitto config for the in-AWS test broker. Anonymous access is safe here only because the
# security group admits nothing but the service tasks.
listener 8883
cafile /tmp/certs/ca.crt
certfile /tmp/certs/server.crt
keyfile /tmp/certs/server.key
allow_anonymous true

# Don't let the broker silently cap the 100k-message bursts
max_queued_messages 0
max_queued_bytes 0
max_inflight_messages 0
message_size_limit 0
persistence false
log_dest stdout
log_type error
log_type warning
