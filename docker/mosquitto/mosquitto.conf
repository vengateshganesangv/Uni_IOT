# Local stand-in for HiveMQ Cloud. TLS on 8883 like the real endpoint. Local dev only (anonymous allowed).
listener 8883
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
allow_anonymous true

# Don't let the broker silently cap the 100k-message bursts
max_queued_messages 0
max_queued_bytes 0
max_inflight_messages 0
message_size_limit 0
persistence false
log_type error
log_type warning
