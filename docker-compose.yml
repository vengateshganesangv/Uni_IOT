# Local stack. The four services are UNMODIFIED: they still connect to the hard-coded HiveMQ hostname,
# but inside this compose network that hostname is an alias of a local Mosquitto broker whose TLS cert
# (issued by a throwaway CA, trusted via NODE_EXTRA_CA_CERTS) matches that hostname.
#
#   docker compose up -d --build                       # 1 priority worker
#   PRIORITY_REPLICAS=4 docker compose up -d           # shared-subscription scale-out
#   node scripts/fire-event.js 90 90 90                # trigger an event
#   docker compose logs -f rescue                      # see "FLOOD EVENT RESULT"
name: smart-disaster-relief

x-svc-env: &svc-env
  HIVEMQ_USERNAME: local
  HIVEMQ_PASSWORD: local
  NODE_EXTRA_CA_CERTS: /certs/ca.crt
  AWS_EC2_METADATA_DISABLED: "true"   # no AWS creds locally; CloudWatch put fails fast and is caught by the app

services:
  certgen:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "/certgen.sh"]
    volumes:
      - certs:/certs
      - ./docker/certgen.sh:/certgen.sh:ro

  broker:
    image: eclipse-mosquitto:2.0
    depends_on:
      certgen:
        condition: service_completed_successfully
    volumes:
      - certs:/certs:ro
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      default:
        aliases:
          - 1490e7aa531c43e6af66775dcb39171b.s1.eu.hivemq.cloud
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "8883", "--cafile", "/certs/ca.crt", "--insecure", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 3s
      timeout: 5s
      retries: 10

  emergency:
    build: ./Emergency_Request_Service
    init: true
    environment: *svc-env
    volumes:
      - certs:/certs:ro
    ports:
      - "3001:3001"
    depends_on:
      broker:
        condition: service_healthy

  priority:
    build:
      context: ./Priority_Service
      dockerfile: Dockerfile.slim
    init: true
    environment: *svc-env
    volumes:
      - certs:/certs:ro
    deploy:
      replicas: ${PRIORITY_REPLICAS:-1}
    depends_on:
      broker:
        condition: service_healthy

  rescue:            # must stay at exactly 1 (stateful, non-shared subscription)
    build: ./Rescue_Service
    init: true
    environment: *svc-env
    volumes:
      - certs:/certs:ro
    depends_on:
      broker:
        condition: service_healthy

volumes:
  certs:
